<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blue gradient for Gemini-style stars -->
    <linearGradient id="blueStarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glowing effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#f8fafc" rx="20"/>
  
  <!-- Robot head/body -->
  <rect x="70" y="60" width="60" height="50" rx="15" fill="url(#robotGradient)" stroke="#2563eb" stroke-width="3"/>
  
  <!-- Robot screen/face -->
  <rect x="77" y="67" width="46" height="36" rx="8" fill="url(#screenGradient)"/>
  
  <!-- Robot eyes (cute and expressive) -->
  <circle cx="88" cy="80" r="6" fill="#ffffff"/>
  <circle cx="112" cy="80" r="6" fill="#ffffff"/>
  <circle cx="88" cy="80" r="4" fill="#2563eb">
    <animate attributeName="cy" values="80;82;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="112" cy="80" r="4" fill="#2563eb">
    <animate attributeName="cy" values="80;82;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Happy mouth -->
  <path d="M 90 92 Q 100 98 110 92" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Robot antennae -->
  <line x1="85" y1="60" x2="85" y2="45" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="60" x2="115" y2="45" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85" cy="45" r="4" fill="#ff6b6b">
    <animate attributeName="fill" values="#ff6b6b;#4ecdc4;#ff6b6b" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="45" r="4" fill="#4ecdc4">
    <animate attributeName="fill" values="#4ecdc4;#ff6b6b;#4ecdc4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot arms -->
  <rect x="50" y="75" width="20" height="8" rx="4" fill="url(#robotGradient)" stroke="#2563eb" stroke-width="2"/>
  <rect x="130" y="75" width="20" height="8" rx="4" fill="url(#robotGradient)" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Robot hands (removed yellow stars) -->
  <circle cx="45" cy="79" r="6" fill="#4285f4"/>
  <circle cx="155" cy="79" r="6" fill="#4285f4"/>
  
  <!-- Bar charts on top -->
  <rect x="70" y="25" width="4" height="8" fill="#10b981">
    <animate attributeName="height" values="8;15;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="25;18;25" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="78" y="20" width="4" height="13" fill="#3b82f6">
    <animate attributeName="height" values="13;20;13" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="20;13;20" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="86" y="15" width="4" height="18" fill="#f59e0b">
    <animate attributeName="height" values="18;25;18" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="15;8;15" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="94" y="22" width="4" height="11" fill="#ef4444">
    <animate attributeName="height" values="11;18;11" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="22;15;22" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="102" y="18" width="4" height="15" fill="#8b5cf6">
    <animate attributeName="height" values="15;22;15" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="18;11;18" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="25" width="4" height="8" fill="#06b6d4">
    <animate attributeName="height" values="8;15;8" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="25;18;25" dur="2.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="118" y="20" width="4" height="13" fill="#10b981">
    <animate attributeName="height" values="13;20;13" dur="2.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="20;13;20" dur="2.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="126" y="23" width="4" height="10" fill="#f59e0b">
    <animate attributeName="height" values="10;17;10" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="23;16;23" dur="2.1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Robot legs -->
  <rect x="78" y="110" width="8" height="20" rx="4" fill="url(#robotGradient)" stroke="#2563eb" stroke-width="2"/>
  <rect x="114" y="110" width="8" height="20" rx="4" fill="url(#robotGradient)" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Robot feet -->
  <ellipse cx="82" cy="135" rx="8" ry="4" fill="#2563eb"/>
  <ellipse cx="118" cy="135" rx="8" ry="4" fill="#2563eb"/>
  
  <!-- Floating data particles around robot -->
  <circle cx="40" cy="50" r="2" fill="#10b981">
    <animate attributeName="cy" values="50;45;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="55" r="2" fill="#3b82f6">
    <animate attributeName="cy" values="55;50;55" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="100" r="1.5" fill="#f59e0b">
    <animate attributeName="cy" values="100;95;100" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="95" r="1.5" fill="#ef4444">
    <animate attributeName="cy" values="95;90;95" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Gemini-style blue stars (replacing thought bubble) -->
  <g transform="translate(140,40)">
    <!-- Main star -->
    <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,4 -5,7 -3,1 -8,-2 -2,-2" 
             fill="url(#blueStarGradient)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Secondary smaller stars -->
    <g transform="translate(-12,-5)">
      <polygon points="0,-4 1,-1 4,-1 1.5,0.5 2.5,3.5 0,2 -2.5,3.5 -1.5,0.5 -4,-1 -1,-1" 
               fill="#4285f4" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" 
                          values="0;-360" dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>
    
    <g transform="translate(12,8)">
      <polygon points="0,-3 0.8,-0.8 3,-0.8 1.2,0.4 2,2.8 0,1.6 -2,2.8 -1.2,0.4 -3,-0.8 -0.8,-0.8" 
               fill="#34a853" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.5;0.8" dur="1.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" 
                          values="0;360" dur="5s" repeatCount="indefinite"/>
      </polygon>
    </g>
    
    <!-- Connecting lines (neural network style) -->
    <line x1="-12" y1="-5" x2="0" y2="0" stroke="#4285f4" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="12" y1="8" x2="0" y2="0" stroke="#34a853" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Data flow indicator (replacing thought bubble concept) -->
  <g transform="translate(155,40)">
    <circle r="3" fill="#4285f4" opacity="0.6">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#34a853">
      <animate attributeName="fill" values="#34a853;#4285f4;#ea4335;#34a853" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main title -->
  <text x="100" y="170" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="20" font-weight="bold">STAR</text>
  
  <!-- Additional blue accent stars for Gemini feel -->
  <g fill="#4285f4">
    <polygon points="25,30 26,33 29,33 27,35 28,38 25,36 22,38 23,35 21,33 24,33" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="12s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="175,120 176,123 179,123 177,125 178,128 175,126 172,128 173,125 171,123 174,123" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;-360" dur="10s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>